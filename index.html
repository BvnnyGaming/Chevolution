<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chevolution — Training Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110d;
    --panel: #1d1812;
    --panel-border: #2e2620;
    --board-light: #e4d9be;
    --board-dark: #6b4a30;
    --board-frame: #443122;
    --text: #ede4d2;
    --text-muted: #8c8271;
    --accent: #c08a4e;
    --win: #8faa7f;
    --loss: #b06a58;
    --draw: #8c8271;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
  }

  body {
    display: flex;
    align-items: center;
    padding: 6vh 6vw;
  }

  .layout {
    display: flex;
    align-items: flex-start;
    gap: 5vw;
    width: 100%;
    max-width: 1400px;
  }

  /* ---- Board ---- */

  .board-wrapper {
    flex: 0 0 auto;
    width: min(46vw, 640px);
  }

  .board-label {
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .board-frame {
    background: var(--board-frame);
    padding: 14px;
    border-radius: 2px;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  .square {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(4.2vw, 46px);
    line-height: 1;
    user-select: none;
    position: relative;
  }

  .square.light { background: var(--board-light); }
  .square.dark  { background: var(--board-dark); }

  .square.piece-white { color: #f4efe2; text-shadow: 0 1px 2px rgba(0,0,0,0.55); }
  .square.piece-black { color: #201a12; }

  .square.last-move::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: 0.28;
  }

  /* ---- Stats panel ---- */

  .stats {
    flex: 1 1 auto;
    min-width: 260px;
    max-width: 380px;
    padding-top: 4px;
  }

  .game-id {
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  .game-number {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 22px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--panel-border);
    font-size: 0.86rem;
  }

  .stat-row .k { color: var(--text-muted); }
  .stat-row .v { font-weight: 500; }

  .v.win  { color: var(--win); }
  .v.loss { color: var(--loss); }
  .v.draw { color: var(--draw); }

  .status-line {
    margin-top: 18px;
    font-size: 0.78rem;
    color: var(--text-muted);
    min-height: 1.2em;
  }

  .recent {
    margin-top: 32px;
  }

  .recent-label {
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .recent-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .recent-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .recent-row .res.win  { color: var(--win); }
  .recent-row .res.loss { color: var(--loss); }
  .recent-row .res.draw { color: var(--draw); }

  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .board-wrapper { width: 100%; }
    .stats { max-width: none; }
  }
</style>
</head>
<body>

<div class="layout">

  <div class="board-wrapper">
    <div class="board-label">SELF-PLAY — LIVE</div>
    <div class="board-frame">
      <div class="board" id="board"></div>
    </div>
  </div>

  <div class="stats">
    <div class="game-id" id="gameId">—</div>
    <div class="game-number" id="gameNumber">Waiting for games…</div>

    <div class="stat-row"><span class="k">model step</span><span class="v" id="modelStep">—</span></div>
    <div class="stat-row"><span class="k">mcts iterations</span><span class="v" id="mctsIters">—</span></div>
    <div class="stat-row"><span class="k">ply</span><span class="v" id="plyProgress">—</span></div>
    <div class="stat-row"><span class="k">duration</span><span class="v" id="duration">—</span></div>
    <div class="stat-row"><span class="k">result</span><span class="v" id="result">—</span></div>

    <div class="status-line" id="statusLine"></div>

    <div class="recent">
      <div class="recent-label">RECENT GAMES</div>
      <div class="recent-list" id="recentList"></div>
    </div>
  </div>

</div>

<script>
const PIECES = {
  white: { k: '♔', q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
  black: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' },
};

const MOVE_DELAY_MS = 5000;
const END_OF_GAME_PAUSE_MS = 3000;
const POLL_WHEN_WAITING_MS = 2000;

let boardState = null;
let squareEls = [];

function freshBoard() {
  // row 0 = rank 8 (black back rank) ... row 7 = rank 1 (white back rank)
  const back = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
  const board = [];
  board.push(back.map(t => ({ type: t, color: 'black' })));
  board.push(Array(8).fill(null).map(() => ({ type: 'p', color: 'black' })));
  for (let r = 2; r <= 5; r++) board.push(Array(8).fill(null));
  board.push(Array(8).fill(null).map(() => ({ type: 'p', color: 'white' })));
  board.push(back.map(t => ({ type: t, color: 'white' })));
  return board;
}

function buildBoardDom() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  squareEls = [];
  for (let row = 0; row < 8; row++) {
    const rowEls = [];
    for (let col = 0; col < 8; col++) {
      const sq = document.createElement('div');
      const isLight = (row + col) % 2 === 0;
      sq.className = 'square ' + (isLight ? 'light' : 'dark');
      boardEl.appendChild(sq);
      rowEls.push(sq);
    }
    squareEls.push(rowEls);
  }
}

function renderBoard(highlight) {
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const piece = boardState[row][col];
      const sq = squareEls[row][col];
      sq.classList.remove('piece-white', 'piece-black', 'last-move');
      sq.textContent = piece ? PIECES[piece.color][piece.type] : '';
      if (piece) sq.classList.add(piece.color === 'white' ? 'piece-white' : 'piece-black');
    }
  }
  if (highlight) {
    squareEls[highlight.from[1]][highlight.from[0]].classList.add('last-move');
    squareEls[highlight.to[1]][highlight.to[0]].classList.add('last-move');
  }
}

function applyMove(move) {
  const [fx, fy] = move.from;
  const [tx, ty] = move.to;
  const piece = boardState[fy][fx];
  boardState[ty][tx] = piece;
  boardState[fy][fx] = null;
}

function shortId(id) {
  return id ? id.slice(0, 8) : '—';
}

function resultLabel(result) {
  if (result === 0.5) return { text: 'draw', cls: 'draw' };
  if (result === 1.0) return { text: 'white wins', cls: 'win' };
  if (result === 0.0) return { text: 'black wins', cls: 'loss' };
  return { text: String(result), cls: '' };
}

function formatDuration(startedAt, finishedAt) {
  if (!startedAt || !finishedAt) return '—';
  const secs = Math.max(0, finishedAt - startedAt);
  return secs < 60 ? `${secs.toFixed(1)}s` : `${(secs / 60).toFixed(1)}m`;
}

const recentGames = [];

function pushRecent(gameIndex, game) {
  const { text, cls } = resultLabel(game.result);
  recentGames.unshift({ label: `#${gameIndex}`, text, cls });
  if (recentGames.length > 8) recentGames.pop();
  const list = document.getElementById('recentList');
  list.innerHTML = '';
  for (const g of recentGames) {
    const row = document.createElement('div');
    row.className = 'recent-row';
    row.innerHTML = `<span>${g.label}</span><span class="res ${g.cls}">${g.text}</span>`;
    list.appendChild(row);
  }
}

async function fetchJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url} -> ${res.status}`);
  return res.json();
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function playGame(gameIndex, game) {
  boardState = freshBoard();
  buildBoardDom();
  renderBoard(null);

  document.getElementById('gameId').textContent = shortId(game.id);
  document.getElementById('gameNumber').textContent = `Game #${gameIndex}`;
  document.getElementById('modelStep').textContent = game.model_step ?? '—';
  document.getElementById('mctsIters').textContent = game.mcts_iterations ?? '—';
  document.getElementById('result').textContent = '—';
  document.getElementById('result').className = 'v';
  document.getElementById('statusLine').textContent = 'Playing…';

  const moves = game.moves || [];
  for (let i = 0; i < moves.length; i++) {
    applyMove(moves[i]);
    renderBoard(moves[i]);
    document.getElementById('plyProgress').textContent = `${i + 1} / ${moves.length}`;
    await sleep(MOVE_DELAY_MS);
  }

  const { text, cls } = resultLabel(game.result);
  document.getElementById('result').textContent = text;
  document.getElementById('result').className = `v ${cls}`;
  document.getElementById('duration').textContent = formatDuration(game.started_at, game.finished_at);
  document.getElementById('statusLine').textContent = 'Game finished.';
  pushRecent(gameIndex, game);

  await sleep(END_OF_GAME_PAUSE_MS);
}

async function main() {
  let index = 0;
  buildBoardDom();
  boardState = freshBoard();
  renderBoard(null);

  while (true) {
    let count;
    try {
      ({ count } = await fetchJson('/api/games/count'));
    } catch (e) {
      document.getElementById('statusLine').textContent = 'Cannot reach server — is server.py running?';
      await sleep(POLL_WHEN_WAITING_MS);
      continue;
    }

    if (index >= count) {
      document.getElementById('statusLine').textContent = 'Waiting for the next game…';
      await sleep(POLL_WHEN_WAITING_MS);
      continue;
    }

    try {
      const game = await fetchJson(`/api/games/${index}`);
      await playGame(index, game);
      index++;
    } catch (e) {
      console.error(e);
      await sleep(POLL_WHEN_WAITING_MS);
    }
  }
}

main();
</script>

</body>
</html>
